name: Deploy Customer API to ECR

on:
  workflow_dispatch:
    inputs:
      # 빌드 내용 간단한 설명
      description:
        description: '(optional)해당 빌드에 대한 간단한 설명을 추가합니다'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # AWS 자격증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub Actions Runner의 현재 IP 확인
      - name: Get runner IP address
        id: ip
        uses: haythem/public-ip@v1.3

      # EC2 보안 그룹에 현재 IP 추가 (SSH 접근 허용)
      - name: Add IP to security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=GitHub-Actions-Temp},{Key=CreatedBy,Value=GitHub-Actions}]' || echo "Rule may already exist"

      - name: Gradle Build (bootJar)
        run: ./gradlew :eatngo-customer-api:bootJar
        env:
          SPRING_PROFILES_ACTIVE: prod
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Upload 전에 JAR 파일 존재 확인
      - name: Check JAR file
        run: |
          echo "=== Built JAR files ==="
          ls -la eatngo-customer-api/build/libs/
          JAR_COUNT=$(ls eatngo-customer-api/build/libs/*.jar 2>/dev/null | wc -l)
          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: JAR file not found!"
            exit 1
          fi
          echo "Found $JAR_COUNT JAR file(s)"    

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "eatngo-customer-api/build/libs/*.jar"
          target: "/home/ec2-user/eatngo-customer-api"
          timeout: 30s

      # SSH 연결 테스트
      - name: Test SSH and check files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          script: |
            echo "=== SSH Connection Test ==="
            whoami
            pwd
            echo "=== Checking uploaded files ==="
            ls -la /home/ec2-user/
            find /home/ec2-user -name "*.jar" -type f || echo "No JAR files found"       

      - name: Remote deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            echo "Executing deployment script..."

          # 백그라운드에서 배포 스크립트 실행
            nohup /home/ec2-user/deploy.sh > /home/ec2-user/deployment.log 2>&1 &
            
            # 잠시 대기
            sleep 8
            
            # 결과 확인
            echo "=== Deployment Results ==="
            if [ -f /home/ec2-user/deploy_error.log ]; then
              echo "❌ Deployment Error:"
              cat /home/ec2-user/deploy_error.log
              exit 1
            fi
            
            if [ -f /home/ec2-user/app.pid ]; then
              PID=$(cat /home/ec2-user/app.pid)
              if ps -p $PID > /dev/null; then
                echo "✅ Application is running (PID: $PID)"
              else
                echo "❌ Application process died"
                tail -n 20 /home/ec2-user/app.log
                exit 1
              fi
            else
              echo "❌ PID file not found"
              exit 1
            fi

      # 배포 완료 후 보안 그룹에서 IP 제거
      - name: Remove IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule may not exist or already removed"

      # 배포 결과 확인
      - name: Verify deployment
        run: |
          echo "🎉 Deployment completed!"