name: Deploy Customer API to ECR

on:
  workflow_dispatch:
    inputs:
      # 빌드 내용 간단한 설명
      description:
        description: '(optional)해당 빌드에 대한 간단한 설명을 추가합니다'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # AWS 자격증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub Actions Runner의 현재 IP 확인
      - name: Get runner IP address
        id: ip
        uses: haythem/public-ip@v1.3

      # EC2 보안 그룹에 현재 IP 추가 (SSH 접근 허용)
      - name: Add IP to security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=GitHub-Actions-Temp},{Key=CreatedBy,Value=GitHub-Actions}]' || echo "Rule may already exist"

      - name: Gradle Build (bootJar)
        run: ./gradlew :eatngo-customer-api:bootJar
        env:
          SPRING_PROFILES_ACTIVE: prod
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # JAR 파일 존재 확인
      - name: Check JAR file
        run: |
          echo "=== Built JAR files ==="
          ls -la eatngo-customer-api/build/libs/
          if [ ! -f eatngo-customer-api/build/libs/*.jar ]; then
            echo "ERROR: JAR file not found!"
            exit 1
          fi   

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "eatngo-customer-api/build/libs/*.jar"
          target: "/home/ec2-user/eatngo-customer-api"
          timeout: 30s
          strip_components: 3

      # SSH 연결 테스트
      - name: Test SSH and check files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          script: |
            echo "=== SSH Connection Test ==="
            whoami
            pwd
            echo "=== Checking uploaded files ==="
            ls -la /home/ec2-user/
            find /home/ec2-user -name "*.jar" -type f || echo "No JAR files found"       

      - name: Remote deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            echo "=== Starting Deployment ==="
            
            # 기존 프로세스 종료
            pkill -f 'eatngo-customer-api' || echo "No existing process"
            sleep 2
            
            # JAR 파일 찾기
            JAR_FILE=$(find /home/ec2-user -name "*.jar" -type f | head -n 1)
            
            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found!"
              ls -la /home/ec2-user/
              exit 1
            fi
            
            echo "Found JAR file: $JAR_FILE"
            
            # 환경변수와 함께 완전히 분리된 프로세스로 실행
            env AWS_REGION=ap-northeast-2 \
                AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }} \
                AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
                setsid java -jar "$JAR_FILE" \
                --spring.profiles.active=dev \
                --server.port=8080 \
                > /home/ec2-user/app.log 2>&1 &
            
            APP_PID=$!
            echo "Application started with PID: $APP_PID"
            echo $APP_PID > /home/ec2-user/app.pid
            
            # 프로세스 확인
            sleep 3
            if ps -p $APP_PID > /dev/null; then
              echo "✅ Application is running!"
            else
              echo "❌ Application failed to start"
              echo "=== Error logs ==="
              tail -n 20 /home/ec2-user/app.log
              exit 1
            fi      

      # 배포 완료 후 보안 그룹에서 IP 제거
      - name: Remove IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule may not exist or already removed"

      # 배포 결과 확인
      - name: Verify deployment
        run: |
          echo "🎉 Deployment completed!"