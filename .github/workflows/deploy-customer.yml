name: Deploy Customer API to ECR

on:
  workflow_dispatch:
    inputs:
      # 빌드 내용 간단한 설명
      description:
        description: '(optional)해당 빌드에 대한 간단한 설명을 추가합니다'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gradle Build (bootJar)
        run: ./gradlew :eatngo-customer-api:bootJar
        env:
          SPRING_PROFILES_ACTIVE: prod
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "eatngo-customer-api/build/libs/*.jar"
          target: "/home/ec2-user/eatngo-customer-api"

      - name: Remote deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
              # 기존 프로세스 종료
              pkill -f 'eatngo-customer-api' || true
              sleep 2
              
              # JAR 파일 찾기
              JAR_FILE=$(find /home/ec2-user/eatngo-customer-api -name "*.jar" -type f | head -n 1)
              
              if [ -z "$JAR_FILE" ]; then
                echo "ERROR: JAR file not found!"
                ls -la /home/ec2-user/
                exit 1
              fi
              
              echo "Found JAR file: $JAR_FILE"
              
              (
                export AWS_REGION=ap-northeast-2
                export AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}
                export AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
              
                setsid nohup java -jar "$JAR_FILE" \
                  --spring.profiles.active=prod \
                  --server.port=8080 \
                  </dev/null >/home/ec2-user/app.log 2>&1 &
              
                echo $! > /home/ec2-user/app.pid
              ) &
              
              # 잠시 대기
              sleep 3
              
              # 프로세스 확인
              if [ -f /home/ec2-user/app.pid ]; then
                PID=$(cat /home/ec2-user/app.pid)
                if ps -p $PID > /dev/null 2>&1; then
                  echo "✅ Application started with PID: $PID"
                else
                  echo "❌ Application failed to start"
                  tail -n 20 /home/ec2-user/app.log
                  exit 1
                fi
              else
                echo "❌ PID file not created"
                exit 1
              fi